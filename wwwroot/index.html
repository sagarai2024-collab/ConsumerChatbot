<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamCo Support — AI Chatbot Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f1b33 0%, #1a2f52 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    color: #e8edf5;
  }
  header {
    width: 100%; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { font-size: 1.25rem; font-weight: 700; }
  .brand span { color: #4fa3ff; }
  .badge {
    font-size: .72rem; padding: 3px 10px; border-radius: 20px;
    background: rgba(79,163,255,.15); border: 1px solid rgba(79,163,255,.4); color: #8fc2ff;
  }
  nav a { color: #8fc2ff; text-decoration: none; font-size: .9rem; margin-left: 18px; }
  nav a:hover { text-decoration: underline; }
  .chat-wrap {
    width: min(720px, 94vw); flex: 1; display: flex; flex-direction: column;
    margin: 24px 0; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.09); border-radius: 16px; overflow: hidden;
  }
  #messages { flex: 1; min-height: 380px; max-height: 60vh; overflow-y: auto; padding: 22px; }
  .msg { max-width: 82%; margin-bottom: 14px; padding: 11px 15px; border-radius: 14px; line-height: 1.45; font-size: .93rem; white-space: pre-wrap; }
  .user { background: #2f6fce; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot  { background: rgba(255,255,255,.09); border-bottom-left-radius: 4px; }
  .meta { font-size: .7rem; color: #93a5c4; margin: -8px 0 14px 4px; }
  .meta b { color: #7fb5ff; font-weight: 600; }
  .composer { display: flex; gap: 10px; padding: 16px; border-top: 1px solid rgba(255,255,255,.08); }
  .composer input {
    flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(0,0,0,.25); color: #e8edf5; font-size: .95rem; outline: none;
  }
  .composer input:focus { border-color: #4fa3ff; }
  .composer button {
    padding: 12px 22px; border: none; border-radius: 10px; background: #2f6fce; color: #fff;
    font-weight: 600; cursor: pointer; font-size: .95rem;
  }
  .composer button:hover { background: #3a7de0; }
  .composer button:disabled { opacity: .5; cursor: wait; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
  .suggestions button {
    font-size: .78rem; padding: 6px 12px; border-radius: 16px; cursor: pointer;
    background: transparent; border: 1px solid rgba(143,194,255,.4); color: #8fc2ff;
  }
  .suggestions button:hover { background: rgba(79,163,255,.12); }
  footer { padding: 14px; font-size: .75rem; color: #7286a8; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand">Stream<span>Co</span> Support <span class="badge" id="mode">…</span></div>
  <nav><a href="/admin.html">Admin Dashboard →</a></nav>
</header>

<div class="chat-wrap">
  <div id="messages">
    <div class="msg bot">Hi! I'm StreamCo's AI support assistant. Every answer I give is grounded in our knowledge base — I never make things up. Try me!</div>
  </div>
  <div class="suggestions">
    <button onclick="ask('How many screens can I watch on at the same time?')">Screen limits</button>
    <button onclick="ask('How do I reset my password?')">Password reset</button>
    <button onclick="ask('What is your refund policy?')">Refunds</button>
    <button onclick="ask('Why is my video buffering?')">Buffering</button>
    <button onclick="ask('Can I fly to the moon with StreamCo?')">Out-of-scope test</button>
  </div>
  <div class="composer">
    <input id="input" placeholder="Ask about plans, billing, devices, downloads…" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>

<footer>
  RAG demo — .NET 9 · Microsoft Semantic Kernel · Azure OpenAI · fast-path routing · response cache · hallucination prevention
</footer>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function add(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function addMeta(result) {
  const div = document.createElement('div');
  div.className = 'meta';
  let html = 'path: <b>' + result.path + '</b> · topic: <b>' + result.topic + '</b>';
  if (result.sources && result.sources.length)
    html += ' · sources: ' + result.sources.map(s => s.id + ' (' + s.score + ')').join(', ');
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function ask(text) {
  const question = (text || input.value).trim();
  if (!question) return;
  input.value = '';
  add('user', question);
  sendBtn.disabled = true;
  const pending = add('bot', '…');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question })
    });
    const data = await res.json();
    pending.textContent = data.answer;
    addMeta(data);
    document.getElementById('mode').textContent = data.mode === 'azure-openai' ? 'Azure OpenAI' : 'offline mode';
  } catch (e) {
    pending.textContent = 'Error: ' + e.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', () => ask());
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message:'hi'}) })
  .then(r => r.json()).then(d => document.getElementById('mode').textContent = d.mode === 'azure-openai' ? 'Azure OpenAI' : 'offline mode');
</script>
</body>
</html>
